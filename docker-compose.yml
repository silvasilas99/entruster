version: '3.8'

services:
  setup:
    image: docker:24-cli
    container_name: fabric-setup
    volumes:
      - ${PWD}:${PWD}
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: ${PWD}
    environment:
      - GOFLAGS=-buildvcs=false
    entrypoint: /bin/sh
    command: -c "rm -f .fabric_ready && apk add --no-cache bash curl jq gcompat libc6-compat go && ./scripts/network-setup.sh && touch .fabric_ready && (docker restart entruster-api || true)"
    network_mode: "host"

  api:
    container_name: entruster-api
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      - TEST_NETWORK_PATH=/app/fabric-samples/test-network
      - PEER_ENDPOINT=dns:///localhost:7051
      - PORT=8080
      - ELASTICSEARCH_URL=http://localhost:9200
    volumes:
      - ./fabric-samples:/app/fabric-samples
      - .:/app/shared          # exposes project root so .fabric_ready sentinel is visible
    network_mode: "host"
    restart: on-failure
    depends_on:
      elasticsearch:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - esdata:/usr/share/elasticsearch/data

volumes:
  esdata:
